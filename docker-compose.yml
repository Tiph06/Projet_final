services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: infoendo_app
    volumes:
      - ./:/var/www

  web:
    image: nginx:alpine
    container_name: infoendo_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
